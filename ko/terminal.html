<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>터미널</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="drive">
  <div class="window">
    <div class="window-bar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="title">terminal.html —— VHS-2003 터미널</div>
    </div>
    <div class="window-body">
      <div class="terminal" id="term">
        <div class="line">VHS-2003 터미널 v1.0</div>
        <div class="line">소유자: 루위안</div>
        <div class="line"><span class="ok">help</span> 를 입력하면 사용 가능한 명령어를 볼 수 있습니다.</div>
        <div class="line">&nbsp;</div>
      </div>
      <div style="display:flex;align-items:center;margin-top:12px;">
        <span style="color:#ffb300;margin-right:8px;font-family:'Courier New',monospace;">&gt;</span>
        <input type="text" id="term-input" style="flex:1;background:#0a0a0a;border:1px solid #2e2820;color:#ffb300;padding:8px 12px;border-radius:4px;outline:none;font-family:'Courier New',monospace;" autocomplete="off" autofocus>
      </div>
    </div>
  </div>
</div>
<script src="script.js"></script>
<script>
const term = document.getElementById('term');
const input = document.getElementById('term-input');
function print(text, cls = '') {
  const div = document.createElement('div');
  div.className = 'line ' + cls;
  div.innerHTML = text;
  term.appendChild(div);
  term.scrollTop = term.scrollHeight;
}
const COMMANDS = {
  help: () => {
    print('사용 가능한 명령어:');
    print('  ls              파일 목록');
    print('  cat [file]      파일 내용 보기');
    print('  unlock [pwd]    보호 파일 해제');
    print('  clear           화면 지우기');
    print('  exit            종료');
  },
  ls: () => {
    print('home.html   about.html   box.html   notes.html');
    print('school.html   tape-01.mp4   tape-02.mp4');
    print('forum.html   news.html   missing.html');
    print('<span class="ok">final.mp4</span>  [보호됨]');
  },
  'cat final.mp4': () => print('파일이 보호되어 있습니다. 먼저 unlock 명령어를 사용하세요.', 'err'),
  'cat final': () => print('파일이 보호되어 있습니다. 먼저 unlock 명령어를 사용하세요.', 'err'),
  unlock: () => print('사용법: unlock [4자리 비밀번호]'),
  clear: () => { term.innerHTML = ''; },
  exit: () => { location.href = 'index.html'; }
};
function handleCommand(raw) {
  const cmd = raw.trim().toLowerCase();
  if (!cmd) return;
  print('&gt; ' + raw);
  if (cmd === 'unlock 4417' || cmd === 'unlock4417') {
    setState({ finalUnlocked: true });
    saveNote('🔓 터미널 해제 성공! final.mp4 복호화 완료.');
    print('<span class="ok">비밀번호 정확. final.mp4 복호화됨.</span>');
    print('이제 final.html에 접근할 수 있습니다.');
    print('<a href="index.html" style="color:#7ee0ff;">테이프 홈</a>으로 돌아가세요.');
    return;
  }
  if (cmd.startsWith('unlock ')) { print('비밀번호가 틀렸습니다.', 'err'); return; }
  if (COMMANDS[cmd]) { COMMANDS[cmd](); return; }
  print('알 수 없는 명령어: ' + raw, 'err');
}
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = input.value; input.value = '';
    handleCommand(v);
  }
});
document.addEventListener('DOMContentLoaded', () => {
  if (!getState().terminalUnlocked) {
    document.querySelector('.window-body').innerHTML = `
      <div class="terminal">
        <div class="line err">접근 거부. 터미널에는 비밀번호가 필요합니다.</div>
        <div class="line">힌트: 4자리. 다른 곳에서 본 적이 있을 겁니다.</div>
      </div>
      <div style="text-align:center;margin-top:16px;">
        <input type="text" id="term-pwd" maxlength="4" placeholder="····" style="background:#0f0d0a;border:1px solid #3e3830;color:#ffb300;padding:10px 14px;border-radius:4px;font-family:'Courier New',monospace;font-size:1rem;letter-spacing:0.3em;text-align:center;width:160px;outline:none;">
        <button class="btn primary" style="margin-left:8px;" onclick="checkTermPwd()">해제</button>
      </div>
    `;
  }
});
function checkTermPwd() {
  const v = document.getElementById('term-pwd').value.trim();
  if (v === '4417') {
    setState({ terminalUnlocked: true });
    saveNote('🔓 터미널 해제. 비밀번호: 4417');
    location.reload();
  } else {
    alert('비밀번호가 틀렸습니다.');
  }
}
</script>
</body>
</html>
