<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Terminal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="drive">
  <div class="window">
    <div class="window-bar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="title">terminal.html —— VHS-2003 Terminal</div>
    </div>
    <div class="window-body">
      <div class="terminal" id="term">
        <div class="line">VHS-2003 TERMINAL v1.0</div>
        <div class="line">Owner: Lu Yuan</div>
        <div class="line">Type <span class="ok">help</span> for available commands.</div>
        <div class="line">&nbsp;</div>
      </div>
      <div style="display:flex;align-items:center;margin-top:12px;">
        <span style="color:#ffb300;margin-right:8px;font-family:'Courier New',monospace;">&gt;</span>
        <input type="text" id="term-input" style="flex:1;background:#0a0a0a;border:1px solid #2e2820;color:#ffb300;padding:8px 12px;border-radius:4px;outline:none;font-family:'Courier New',monospace;" autocomplete="off" autofocus>
      </div>
    </div>
  </div>
</div>
<script src="script.js"></script>
<script>
const term = document.getElementById('term');
const input = document.getElementById('term-input');
function print(text, cls = '') {
  const div = document.createElement('div');
  div.className = 'line ' + cls;
  div.innerHTML = text;
  term.appendChild(div);
  term.scrollTop = term.scrollHeight;
}
const COMMANDS = {
  help: () => {
    print('Available commands:');
    print('  ls              list files');
    print('  cat [file]      view file contents');
    print('  unlock [pwd]    unlock protected file');
    print('  clear           clear screen');
    print('  exit            quit');
  },
  ls: () => {
    print('home.html   about.html   box.html   notes.html');
    print('school.html   tape-01.mp4   tape-02.mp4');
    print('forum.html   news.html   missing.html');
    print('<span class="ok">final.mp4</span>  [PROTECTED]');
  },
  'cat final.mp4': () => print('File protected. Use unlock command first.', 'err'),
  'cat final': () => print('File protected. Use unlock command first.', 'err'),
  unlock: () => print('Usage: unlock [4-digit password]'),
  clear: () => { term.innerHTML = ''; },
  exit: () => { location.href = 'index.html'; }
};
function handleCommand(raw) {
  const cmd = raw.trim().toLowerCase();
  if (!cmd) return;
  print('&gt; ' + raw);
  if (cmd === 'unlock 4417' || cmd === 'unlock4417') {
    setState({ finalUnlocked: true });
    saveNote('🔓 Terminal unlocked! final.mp4 decrypted.');
    print('<span class="ok">Password correct. final.mp4 decrypted.</span>');
    print('You can now access final.html.');
    print('Return to <a href="index.html" style="color:#7ee0ff;">tape home</a>.');
    return;
  }
  if (cmd.startsWith('unlock ')) { print('Wrong password.', 'err'); return; }
  if (COMMANDS[cmd]) { COMMANDS[cmd](); return; }
  print('Unknown command: ' + raw, 'err');
}
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = input.value; input.value = '';
    handleCommand(v);
  }
});
document.addEventListener('DOMContentLoaded', () => {
  if (!getState().terminalUnlocked) {
    document.querySelector('.window-body').innerHTML = `
      <div class="terminal">
        <div class="line err">ACCESS DENIED. Terminal requires a password.</div>
        <div class="line">Hint: 4 digits. You've seen it elsewhere.</div>
      </div>
      <div style="text-align:center;margin-top:16px;">
        <input type="text" id="term-pwd" maxlength="4" placeholder="····" style="background:#0f0d0a;border:1px solid #3e3830;color:#ffb300;padding:10px 14px;border-radius:4px;font-family:'Courier New',monospace;font-size:1rem;letter-spacing:0.3em;text-align:center;width:160px;outline:none;">
        <button class="btn primary" style="margin-left:8px;" onclick="checkTermPwd()">UNLOCK</button>
      </div>
    `;
  }
});
function checkTermPwd() {
  const v = document.getElementById('term-pwd').value.trim();
  if (v === '4417') {
    setState({ terminalUnlocked: true });
    saveNote('🔓 Terminal unlocked. Password: 4417');
    location.reload();
  } else {
    alert('Wrong password.');
  }
}
</script>
</body>
</html>
